<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenRichi — Sign In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --gr-navy-deep:#060b14; --gr-navy:#0a1322; --gr-blue:#2e8de0; --gr-green:#6fce4a;
  }
  * { font-family:'Outfit','Segoe UI',Arial,sans-serif; }
  html, body {
    background: radial-gradient(circle at 20% 10%, #102742 0%, var(--gr-navy) 45%, var(--gr-navy-deep) 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(46,141,224,.18) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(111,206,74,.12) 0%, transparent 45%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, auto, 34px 34px, 34px 34px;
  }
  .login-card {
    width: 380px; max-width: 94vw; border: 1px solid rgba(255,255,255,.08); border-radius: 18px;
    background: rgba(255,255,255,.04); backdrop-filter: blur(16px);
    box-shadow: 0 25px 70px rgba(0,0,0,.55), 0 0 40px rgba(46,141,224,.08);
    overflow: hidden;
  }
  .login-header {
    padding: 34px 30px 22px; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .login-header img { width:64px; height:64px; object-fit:contain; margin-bottom:10px;
    filter: drop-shadow(0 0 18px rgba(111,206,74,.5)); }
  .login-header h1 { font-size: 22px; font-weight: 800; margin-bottom:2px; color:#fff; letter-spacing:.2px; }
  .login-header h1 span { color:#8fe06b; }
  .login-header p  { font-size: 12px; color: #84a0bf; margin: 0; }
  .login-body { padding: 28px 30px 30px; }
  .form-label { color:#c3d4e6; }
  .form-control {
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:#e7eef6;
    border-radius:9px; padding:10px 14px;
  }
  .form-control::placeholder { color:#5d7a99; }
  .form-control:focus { background:rgba(255,255,255,.06); border-color: #2e8de0; box-shadow: 0 0 0 .2rem rgba(46,141,224,.2); color:#fff; }
  .btn-login {
    background: linear-gradient(135deg,#2e8de0,#1c6fc2); border: none; border-radius: 9px;
    padding: 11px; font-weight: 700; letter-spacing: .3px; color:#fff;
    box-shadow: 0 4px 18px rgba(46,141,224,.4);
  }
  .btn-login:hover { background: linear-gradient(135deg,#3a98ec,#2e8de0); box-shadow:0 6px 22px rgba(46,141,224,.55); color:#fff; }
  .version { text-align: center; margin-top: 18px; font-size: 11px; color: #5d7a99; }
  .alert-danger { background:rgba(231,76,60,.14); color:#ffb3a7; border:1px solid rgba(231,76,60,.3); border-radius:9px; }

  @media (max-width: 480px) {
    html, body { align-items: flex-start; padding: 0; }
    .login-card {
      width: 100%; max-width: 100%; border-radius: 0;
      min-height: 100vh; border-left: none; border-right: none;
      display: flex; flex-direction: column; justify-content: center;
    }
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="GenRichi">
    <h1>Gen<span>Richi</span></h1>
    <p>Bioinformatics Partner for Accredited Labs</p>
  </div>
  <div class="login-body">
    {% if get_flashed_messages() %}
      <div class="alert alert-danger alert-sm py-2 mb-3">
        {{ get_flashed_messages()[0] }}
      </div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <input type="text" name="username" class="form-control"
               placeholder="Username" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="••••••••••">
      </div>
      <button type="submit" class="btn btn-login w-100">
        Sign In
      </button>
    </form>
    <div class="version">GenRichi v1.0 · For research use only</div>
  </div>
</div>
</body>
</html>
