# GenRichi Somatic Comprehensive Panel — 62-gene gene-body variant (NOT the deployed Phase 1 default)
# Separate, explicit run mode: gene-body BED + its own MANE Select CDS for the TMB denominator.
# Run with: snakemake --snakefile workflow/Snakefile_comprehensive --configfile config/comprehensive_62gene_config.yaml
# Not covered by deploy_comprehensive.sh (its allowlist is the Phase 1 default only).

samples: config/comprehensive_samples.tsv

ref:
  genome: /home/rami/genrichi/reference_db/ref/hg38.fa
  dbsnp: /home/rami/genrichi/reference_db/dbsnp/dbsnp_146.hg38.vcf.gz
  gnomad: /home/rami/genrichi/reference_db/gnomad/af-only-gnomad.hg38.vcf.gz
  pon: null

panel:
  bed: resources/panel/comprehensive_genes.bed  # 62 gene-body intervals, MANE Select v1.4 transcript extents
  name: "GenRichi Comprehensive Cancer Panel v1 (62-gene gene-body)"

trimming:
  fastp:
    min_length: 50
    quality_threshold: 20

alignment:
  platform: ILLUMINA
  bwa_mem2:
    extra: "-M"

calling:
  mutect2:
    extra: ""
  filter:
    min_af: 0.02
    min_depth: 20
    min_alt_reads: 3

annotation:
  vep:
    cache_dir: /home/rami/genrichi/reference_db/vep_cache
    genome_build: GRCh38
    extra: "--everything --canonical --check_existing --hgvs --sift b --polyphen b --cache_version 113"
  cosmic:
    vcf: /home/rami/genrichi/reference_db/cosmic/CosmicCodingMuts.vcf.gz
  clinvar:
    vcf: /home/rami/genrichi/reference_db/clinvar/clinvar.vcf.gz

cnv:
  amp_threshold: 0.58      # log2 ratio ~ 1.5 copies above diploid
  del_threshold: -1.0      # log2 ratio ~ 0.5 copies (hemizygous del)
  min_probes: 5            # minimum probes per segment to report

msi:
  threshold: 10.0          # MS-context indels/Mb → MSI-High (panel-based estimate)

tmb:
  coding_mb: 1.5           # MSI denominator only — do not change (panel-based indel scoring)
  coding_bed: resources/panel/comprehensive_genes_cds.bed   # TMB denominator: MANE Select v1.4 CDS clipped to the 62-gene BED above (built by workflow/scripts/build_cds_bed.py)
  partial_threshold: 0.80  # fraction of panel chromosomes needing coverage for full TMB; below → partial run
  high_threshold: 10.0     # TMB-High threshold (mut/Mb); requires assay-specific clinical validation

report:
  company: "GenRichi"
  logo: /home/rami/genrichi/genrichi_logo_final.png
  show_synonymous: false
