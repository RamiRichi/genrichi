# GenRichi Somatic Comprehensive Panel — Configuration
# Run with: snakemake --snakefile workflow/Snakefile_comprehensive --configfile config/comprehensive_config.yaml

samples: config/comprehensive_samples.tsv

ref:
  genome: /home/rami/genrichi/reference_db/ref/hg38.fa
  dbsnp: /home/rami/genrichi/reference_db/dbsnp/dbsnp_146.hg38.vcf.gz
  gnomad: /home/rami/genrichi/reference_db/gnomad/af-only-gnomad.hg38.vcf.gz
  pon: null

panel:
  bed: resources/panel/comprehensive_genes.bed
  name: "GenRichi Comprehensive Cancer Panel v1"

trimming:
  fastp:
    min_length: 50
    quality_threshold: 20

alignment:
  platform: ILLUMINA
  bwa_mem2:
    extra: "-M"

calling:
  mutect2:
    extra: ""
  filter:
    min_af: 0.02
    min_depth: 20
    min_alt_reads: 3

annotation:
  vep:
    cache_dir: /home/rami/genrichi/reference_db/vep_cache
    genome_build: GRCh38
    extra: "--everything --canonical --check_existing --hgvs --sift b --polyphen b"
  cosmic:
    vcf: /home/rami/genrichi/reference_db/cosmic/CosmicCodingMuts.vcf.gz
  clinvar:
    vcf: /home/rami/genrichi/reference_db/clinvar/clinvar.vcf.gz

cnv:
  amp_threshold: 0.58      # log2 ratio ~ 1.5 copies above diploid
  del_threshold: -1.0      # log2 ratio ~ 0.5 copies (hemizygous del)
  min_probes: 5            # minimum probes per segment to report

msi:
  threshold: 10.0          # MS-context indels/Mb → MSI-High (panel-based estimate)

tmb:
  coding_mb: 1.5           # sequenced coding panel size in Mb (update per panel)
  high_threshold: 10.0     # TMB-High cutoff (mutations/Mb, FDA pembrolizumab approval)

report:
  company: "GenRichi"
  logo: /home/rami/genrichi/genrichi_logo_final.png
  show_synonymous: false
